{% extends "base.html" %}

{% block content %}
    <h1>Recipes List</h1>
    {% for recipe in recipes %}
        <img src="{{recipe.image.url}}" alt="" width="300" height="300">
        <h2>{{ recipe.name }}</h2>
        <p>{{ recipe.recipe }}</p>
        <h3>{{ recipe.category }}</h3>
        <a href="{% url 'detail_recipe' recipe.id%}">
            <button>This dish</button>
        </a>
     {% endfor %}
{% endblock %}
